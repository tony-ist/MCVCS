plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

repositories {
	// Mod Menu, for its Config button.
	maven {
		url = "https://maven.terraformersmc.com/releases/"
		content { includeGroup "com.terraformersmc" }
	}
}

loom {
	splitEnvironmentSourceSets()

	runs {
		// A separate run folder per Minecraft version, so worlds and configs from other versions don't clash.
		server { runDir "run/${project.minecraft_version}" }
		client {
			runDir "run/${project.minecraft_version}"
			// Without this the client logs in as a random "Player<n>" each launch, i.e. a different offline UUID every
			// time, so anything keyed by player (selections in mcvcs/selections.json) is never found again after a restart.
			programArgs "--username", "Dev"
		}
	}

	mods {
		"mcvcs" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

// Game tests: https://docs.fabricmc.net/develop/automatic-testing#setting-up-game-tests-with-fabric-loom
fabricApi {
	configureTests {
		createSourceSet = true
		modId = "mcvcs-test"
		enableGameTests = false
		enableClientGameTests = true
		eula = true
	}
}

// `gradlew runClientGameTest -Pgametest=VcsCheckoutCommandGameTest` runs just that test (comma-separate for several);
// VcsGameTest reads the system property and skips the rest.
tasks.named("runClientGameTest") {
	if (project.hasProperty("gametest")) {
		jvmArgs "-Dmcvcs.gametest=${project.property("gametest")}"
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Compile only: the mod runs without Mod Menu, which alone loads the "modmenu" entrypoint.
	compileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

// Only the file name carries the loader/MC suffix (mcvcs-1.7.0-fabric+mc26.1.2.jar). Keeping it out of project.version
// keeps fabric.mod.json at a plain 1.7.0, since SemVer would treat "-fabric" as a pre-release tag.
tasks.withType(AbstractArchiveTask).configureEach {
	archiveVersion = "${project.version}-fabric+mc${project.minecraft_version}"
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
